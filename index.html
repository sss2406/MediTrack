<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    const session = JSON.parse(localStorage.getItem('mt_session') || 'null');

    if (!session || session.expires < Date.now()) {
      localStorage.removeItem('mt_session');
      localStorage.removeItem('mt_user');
      window.location.href = 'auth.html';
    }
  </script>

  <title>MediTrack</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#06b6d4" />


</head>

<body class="home">

  <div class="user-box">
    <div id="welcomeUser"></div>
    <button class="logout-btn" onclick="logout()">
      Logout
    </button>
  </div>

  <div class="one">
    <h1>MediTrack</h1>
    <p>A responsive web dashboard to manage health records and vitals</p>

    <a href="add-record.html">Add Record</a>
    <a href="dashboard.html">Dashboard</a>
  </div>

  

  <script>
    const user = JSON.parse(localStorage.getItem('mt_user'));

    if(user){
      document.getElementById('welcomeUser').innerHTML =
      `<strong>${user.name}</strong><br>${user.role}`;
    }

    function logout(){
      localStorage.removeItem('mt_session');
      localStorage.removeItem('mt_user');

      alert('Logged out successfully');

      window.location.href='auth.html';
    }
  </script>

  <script src="./meditrack-hub.js"></script>

</body>
</html>
