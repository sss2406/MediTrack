<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  const session = JSON.parse(localStorage.getItem('mt_session') || 'null');
  if (!session || session.expires < Date.now()) {
    localStorage.removeItem('mt_session');
    localStorage.removeItem('mt_user');
    window.location.href = 'auth.html';
  }
</script>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#06b6d4" />
<title>Add Patient Record — MediTrack</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --card: #243447;
    --accent: #06b6d4;
    --accent2: #8b5cf6;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: #334155;
    --danger: #ef4444;
    --success: #10b981;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(6,182,212,.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(139,92,246,.08) 0%, transparent 50%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 70px;
    padding-bottom: 40px;
  }

  .app-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    z-index: 1001;
  }

  .app-header span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .one {
    width: 90%;
    max-width: 900px;
    max-height: calc(100vh - 100px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  h1 {
    text-align: center;
    margin: 0;
    padding: 24px 30px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    background-color: var(--surface);
  }

  .scroll-content {
    padding: 24px 36px 36px;
    overflow-y: auto;
    flex-grow: 1;
  }

  .scroll-content::-webkit-scrollbar { width: 6px; }
  .scroll-content::-webkit-scrollbar-track { background: var(--card); }
  .scroll-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .scroll-content::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input, select, textarea {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }

  input::placeholder, textarea::placeholder {
    color: #4b5e7a;
  }

  select option { background: var(--card); }

  textarea { resize: vertical; }

  .form-row { display: flex; gap: 20px; }
  .form-group { flex: 1; }

  small {
    font-size: 12px;
    color: var(--muted);
    display: block;
    margin-top: 4px;
  }

  button {
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    width: 100%;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.2s;
    font-family: inherit;
    margin-top: 10px;
  }

  .save-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
  }

  .save-btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }

  .dashboard-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .dashboard-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .home-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .home-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  @media (max-width: 600px) {
    .form-row { flex-direction: column; gap: 0; }
    .one { width: 95%; }
    .scroll-content { padding: 16px 20px 24px; }
  }
</style>
</head>
<body>
  <header class="app-header">
    <span>MediTrack</span>&nbsp;— Add Patient Record
  </header>

  <div class="one">
    <h1>Add Patient Record</h1>

    <div class="scroll-content">
      <form id="patientForm">

        <label>Patient Name</label>
        <input type="text" name="name" placeholder="Enter full name" required>

        <div class="form-row">
          <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" name="mobile" placeholder="Enter mobile number" pattern="[0-9]{10}" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter email address" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" placeholder="Enter age" required>
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select name="gender" required>
              <option value="">SELECT</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Height (cm)</label>
            <input type="number" name="height" placeholder="Enter height in cm" required>
          </div>
          <div class="form-group">
            <label>Weight (kg)</label>
            <input type="number" name="weight" placeholder="Enter weight in kg" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Blood Pressure</label>
            <input type="text" name="blood_pressure" placeholder="120/80" required>
          </div>
          <div class="form-group">
            <label>Heart Rate (bpm)</label>
            <input type="number" name="heart_rate" placeholder="Enter heart rate" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Body Temperature (°C)</label>
            <input type="number" step="0.1" name="temperature" placeholder="Enter temperature" required>
          </div>
          <div class="form-group">
            <label>Follow-up Date</label>
            <input type="date" name="follow_up" required>
          </div>
        </div>

        <label>Symptoms</label>
        <textarea name="symptoms" rows="3" placeholder="Describe symptoms" required></textarea>

        <label>Diagnosis</label>
        <textarea name="diagnosis" rows="3" placeholder="Enter diagnosis" required></textarea>

        <label>Medications</label>
        <textarea name="medications" rows="3" placeholder="List medications" required></textarea>

        <label>Additional Notes</label>
        <textarea name="notes" rows="3" placeholder="Any additional notes"></textarea>

        <label>Attending Doctor</label>
        <input type="text" name="doctor" placeholder="Doctor name" required>

        <label>Upload Medical Files</label>
        <input type="file" name="medical_files" multiple accept=".pdf,.jpg,.jpeg,.png">
        <small>Files are optional</small>

        <button type="submit" class="save-btn">💾 Save Record</button>
        <button type="button" class="dashboard-btn" onclick="window.location.href='dashboard.html'">📊 Go to Dashboard</button>
        <button type="button" class="home-btn" onclick="window.location.href='index.html'">🏠 Back to Home</button>

      </form>
    </div>
  </div>

  <script src="add-record.js"></script>
  <script src="./meditrack-hub.js"></script>
</body>
</html>
